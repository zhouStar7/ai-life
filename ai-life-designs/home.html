<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>住 · 家居 — 中控面板风</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');
body { font-family:'Noto Sans SC',sans-serif; background:#1b1c1e; color:#e8e6e3; }
.mono { font-family:'JetBrains Mono',monospace; }
.panel { background:#242527; border:1px solid #333537; border-radius:1rem; }
.panel:hover { border-color:#4a4c4f; }
.dot { width:8px;height:8px;border-radius:9999px;display:inline-block; }
.dot.on { background:#4ade80; box-shadow:0 0 8px #4ade80; animation:pulse 2s infinite; }
.dot.off { background:#57595c; }
.dot.warn { background:#fbbf24; box-shadow:0 0 8px #fbbf24; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
.scene { border:1px solid #3a3c3f; transition:all .2s; }
.scene.active { background:#2d2e30; border-color:#f59e0b; }
.scene.active .scene-name { color:#fbbf24; }
</style>
</head>
<body class="min-h-screen">

<header class="max-w-6xl mx-auto px-8 pt-8 pb-6 flex items-center justify-between border-b border-neutral-800">
  <div class="flex items-center gap-4">
    <div class="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center">
      <i data-lucide="home" class="w-5 h-5 text-amber-400"></i>
    </div>
    <div>
      <h1 class="text-xl font-bold">家居中控</h1>
      <p class="mono text-[11px] text-neutral-500">HOME ASSISTANT · 9 DEVICES ONLINE</p>
    </div>
  </div>
  <div class="flex items-center gap-3 text-sm">
    <span class="flex items-center gap-2 text-neutral-400"><span class="dot on"></span>中枢在线</span>
    <span class="mono text-neutral-500">23.8°C / 48%RH</span>
  </div>
</header>

<main class="max-w-6xl mx-auto px-8 py-8 grid grid-cols-12 gap-5">

  <!-- 场景模式 -->
  <div class="col-span-12 panel p-6">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-sm font-medium text-neutral-300">场景模式</h2>
      <span class="mono text-[10px] text-neutral-600">SCENES</span>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
      <button class="scene active rounded-xl p-4 text-left">
        <i data-lucide="sun-medium" class="w-5 h-5 text-amber-400 mb-2"></i>
        <p class="scene-name text-sm font-bold">居家日常</p>
        <p class="text-[11px] text-neutral-500 mt-0.5">5 设备运行</p>
      </button>
      <button class="scene rounded-xl p-4 text-left">
        <i data-lucide="moon" class="w-5 h-5 text-neutral-400 mb-2"></i>
        <p class="scene-name text-sm font-bold text-neutral-300">睡眠</p>
        <p class="text-[11px] text-neutral-500 mt-0.5">调暗 + 静音</p>
      </button>
      <button class="scene rounded-xl p-4 text-left">
        <i data-lucide="clapperboard" class="w-5 h-5 text-neutral-400 mb-2"></i>
        <p class="scene-name text-sm font-bold text-neutral-300">观影</p>
        <p class="text-[11px] text-neutral-500 mt-0.5">环境灯带 ON</p>
      </button>
      <button class="scene rounded-xl p-4 text-left">
        <i data-lucide="log-out" class="w-5 h-5 text-neutral-400 mb-2"></i>
        <p class="scene-name text-sm font-bold text-neutral-300">离家撤防</p>
        <p class="text-[11px] text-neutral-500 mt-0.5">节能 + 摄像布防</p>
      </button>
    </div>
  </div>

  <!-- 设备网格 -->
  <div class="col-span-12 md:col-span-8 panel p-6">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-sm font-medium text-neutral-300">设备状态</h2>
      <button class="mono text-[11px] text-neutral-500 hover:text-neutral-300 flex items-center gap-1"><i data-lucide="filter" class="w-3 h-3"></i>全部房间</button>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div class="bg-[#1e1f21] rounded-xl p-4 border border-neutral-800">
        <div class="flex items-center justify-between mb-2"><span class="flex items-center gap-2 text-sm"><span class="dot on"></span>客厅空调</span><i data-lucide="wind" class="w-4 h-4 text-neutral-500"></i></div>
        <p class="mono text-2xl font-semibold">24.5°</p>
        <p class="text-[11px] text-neutral-500 mt-1">制冷 · 静音档</p>
      </div>
      <div class="bg-[#1e1f21] rounded-xl p-4 border border-neutral-800">
        <div class="flex items-center justify-between mb-2"><span class="flex items-center gap-2 text-sm"><span class="dot on"></span>空气净化器</span><i data-lucide="fan" class="w-4 h-4 text-neutral-500"></i></div>
        <p class="mono text-2xl font-semibold">优</p>
        <p class="text-[11px] text-neutral-500 mt-1">PM2.5 = 6 · 自动档</p>
      </div>
      <div class="bg-[#1e1f21] rounded-xl p-4 border border-neutral-800">
        <div class="flex items-center justify-between mb-2"><span class="flex items-center gap-2 text-sm"><span class="dot warn"></span>净水器滤芯</span><i data-lucide="droplet" class="w-4 h-4 text-neutral-500"></i></div>
        <p class="mono text-2xl font-semibold text-amber-400">11%</p>
        <p class="text-[11px] text-neutral-500 mt-1">建议 7 日内更换</p>
      </div>
      <div class="bg-[#1e1f21] rounded-xl p-4 border border-neutral-800">
        <div class="flex items-center justify-between mb-2"><span class="flex items-center gap-2 text-sm"><span class="dot off"></span>扫地机器人</span><i data-lucide="bot" class="w-4 h-4 text-neutral-500"></i></div>
        <p class="mono text-2xl font-semibold text-neutral-500">休眠</p>
        <p class="text-[11px] text-neutral-500 mt-1">下次清扫 明日 14:00</p>
      </div>
    </div>
  </div>

  <!-- 告警与能耗 -->
  <div class="col-span-12 md:col-span-4 flex flex-col gap-5">
    <div class="panel p-5">
      <div class="flex items-center gap-2 mb-3">
        <i data-lucide="bell-ring" class="w-4 h-4 text-amber-400"></i>
        <h3 class="text-sm font-medium">异常与提醒</h3>
      </div>
      <div class="space-y-2.5 text-sm">
        <div class="flex items-start gap-2.5 bg-amber-500/10 border border-amber-500/20 rounded-lg p-3">
          <span class="dot warn mt-1.5 shrink-0"></span>
          <div><p class="text-amber-300 text-xs font-medium">净水器滤芯寿命低</p><p class="text-[11px] text-neutral-500 mt-0.5">天猫同款 ¥89 · 一键补货</p></div>
        </div>
        <div class="flex items-start gap-2.5 bg-neutral-800/60 rounded-lg p-3">
          <span class="dot on mt-1.5 shrink-0"></span>
          <div><p class="text-xs text-neutral-300">门窗传感器正常</p><p class="text-[11px] text-neutral-500 mt-0.5">3 个全开/闭状态可溯源</p></div>
        </div>
      </div>
    </div>
    <div class="panel p-5 flex-1">
      <h3 class="text-sm font-medium text-neutral-300 mb-3">今日能耗</h3>
      <div class="flex items-end gap-1.5 h-20">
        <div class="flex-1 bg-neutral-700 rounded-sm" style="height:30%"></div>
        <div class="flex-1 bg-neutral-700 rounded-sm" style="height:45%"></div>
        <div class="flex-1 bg-neutral-600 rounded-sm" style="height:38%"></div>
        <div class="flex-1 bg-neutral-600 rounded-sm" style="height:60%"></div>
        <div class="flex-1 bg-amber-500/70 rounded-sm" style="height:75%"></div>
        <div class="flex-1 bg-amber-500 rounded-sm" style="height:95%"></div>
      </div>
      <div class="flex items-center justify-between mt-3 text-[11px] text-neutral-500"><span>00:00</span><span>累计 <span class="text-neutral-300 mono">4.6 kWh</span></span><span>24:00</span></div>
    </div>
  </div>
</main>

<script>lucide.createIcons()</script>
</body>
</html>
